name: Adobe Launch Sync

# ── Trigger logic ────────────────────────────────────────────────────────────
#
# Runs on every push to any branch, but only when files under properties/
# change. A single job calls `sync --ci` for the property.
#
# After a successful sync, the workflow automatically performs a `pull`
# to fetch updated resource IDs from Launch and commits them back to the
# branch using [skip ci]. This ensures the Git state is always aligned
# with the remote Launch environment.
#
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ['**']

jobs:
  sync:
    # Explicitly grant write permission so the workflow can push updated IDs back.
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for property changes
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^properties/' || true)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in properties/ — skipping sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in properties/: $CHANGED"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: npm ci

      - name: Write integration.json
        if: steps.check.outputs.changed == 'true'
        run: |
          jq -n \
            --arg clientId "${{ secrets.ADOBE_CLIENT_ID }}" \
            --arg clientSecret "${{ secrets.ADOBE_CLIENT_SECRET }}" \
            --arg orgId "${{ secrets.ADOBE_ORG_ID }}" \
            '{"clientId":$clientId,"clientSecret":$clientSecret,"orgId":$orgId}' \
            > integration.json

      # 1. Sync to Adobe Launch.
      # --ci flag aborts with exit 1 if any resource is Behind in dev/draft mode.
      - name: Sync to Adobe Launch
        if: steps.check.outputs.changed == 'true'
        run: node bin/index.js sync --settings-path properties/property1/reactor-settings.json --ci

      # 2. Automatically pull updated state (IDs change after sync/publish).
      - name: Pull updated IDs from Launch
        if: steps.check.outputs.changed == 'true'
        run: node bin/index.js pull --settings-path properties/property1/reactor-settings.json

      # 3. Commit and push changes back to the branch.
      # Use [skip ci] to prevent infinite loops.
      - name: Commit and push updated IDs
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add properties/
          if git diff --staged --quiet; then
            echo "No ID changes to commit."
          else
            git commit -m "chore: update resource IDs from Launch [skip ci]"
            git push
          fi
